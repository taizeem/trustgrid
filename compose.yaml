services:
  gateway:
    image: traefik:v3.1
    container_name: trustgrid_gateway
    ports:
      - "8088:8000"   # Public HTTP API Entrypoint
      - "8080:8080"   # Traefik Web Dashboard
    volumes:
      - ./infrastructure/gateway/traefik.yaml:/etc/traefik/traefik.yaml:ro
      - ./infrastructure/gateway/dynamic_conf.yaml:/etc/traefik/dynamic_conf.yaml:ro
    depends_on:
      - identity-service
      - vendor-assessment-service
      - workflow-service
      - document-service
      - risk-service
      - integrations-service
    networks:
      - trustgrid_network

  identity-service:
    build:
      context: ./services/identity-service
      dockerfile: Dockerfile
    container_name: trustgrid_identity_svc
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      IDENTITY_DB_NAME: ${IDENTITY_DB_NAME:-trustgrid_identity}
      IDENTITY_DB_USER: ${IDENTITY_DB_USER:-identity_user}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:-identity_secure_pass_dev}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev_insecure_jwt_secret_key_minimum_32_bytes_long_123}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-3600}
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - trustgrid_network

  vendor-assessment-service:
    build:
      context: ./services/vendor-assessment-service
      dockerfile: Dockerfile
    container_name: trustgrid_vendor_svc
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      VENDOR_DB_NAME: ${VENDOR_DB_NAME:-trustgrid_vendor}
      VENDOR_DB_USER: ${VENDOR_DB_USER:-vendor_user}
      VENDOR_DB_PASSWORD: ${VENDOR_DB_PASSWORD:-vendor_secure_pass_dev}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev_insecure_jwt_secret_key_minimum_32_bytes_long_123}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER:-trustgrid_mq}
      RABBITMQ_PASS: ${RABBITMQ_DEFAULT_PASS:-trustgrid_mq_pass_dev}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-trustgrid_vhost}
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks:
      - trustgrid_network

  postgres:
    image: postgres:16-alpine
    container_name: trustgrid_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-trustgrid_admin}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-trustgrid_secure_password_dev}
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-trustgrid_admin} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - trustgrid_network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: trustgrid_rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-trustgrid_mq}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-trustgrid_mq_pass_dev}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-trustgrid_vhost}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - trustgrid_network

  redis:
    image: redis:7-alpine
    container_name: trustgrid_redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-trustgrid_redis_pass_dev}"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-trustgrid_redis_pass_dev} ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - trustgrid_network
  
  workflow-service:
    build:
      context: ./services/workflow-service
      dockerfile: Dockerfile
    container_name: trustgrid_workflow_svc
    environment:
      WORKFLOW_DB_HOST: postgres
      WORKFLOW_DB_PORT: 5432
      WORKFLOW_DB_NAME: ${WORKFLOW_DB_NAME:-trustgrid_workflow}
      WORKFLOW_DB_USER: ${WORKFLOW_DB_USER:-workflow_user}
      WORKFLOW_DB_PASSWORD: ${WORKFLOW_DB_PASSWORD:-workflow_secure_pass_dev}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev_insecure_jwt_secret_key_minimum_32_bytes_long_123}
      SERVER_PORT: 8003
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-trustgrid_mq}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-trustgrid_mq_pass_dev}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-trustgrid_vhost}
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    networks:
      - trustgrid_network

  document-service:
    build:
      context: ./services/document-service
      dockerfile: Dockerfile
    container_name: trustgrid_document_svc
    environment:
      DATABASE_URL: postgres://${DOC_DB_USER:-doc_user}:${DOC_DB_PASSWORD:-doc_secure_pass_dev}@postgres:5432/${DOC_DB_NAME:-trustgrid_document}
      STORAGE_DIR: ${DOC_STORAGE_DIR:-/data/documents}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev_insecure_jwt_secret_key_minimum_32_bytes_long_123}
      PORT: 8004
    ports:
      - "8004:8004"
    volumes:
      - document_data:/data/documents
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - trustgrid_network

  risk-service:
    build:
      context: ./services/risk-service
      dockerfile: Dockerfile
    container_name: trustgrid_risk_svc
    environment:
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev_insecure_jwt_secret_key_minimum_32_bytes_long_123}
      PORT: 8005
    ports:
      - "8005:8005"
    networks:
      - trustgrid_network

  integrations-service:
    build:
      context: ./services/integrations-service
      dockerfile: Dockerfile
    container_name: trustgrid_integrations_svc
    environment:
      PORT: 8006
      INTEGRATIONS_DB_HOST: postgres
      INTEGRATIONS_DB_PORT: 5432
      INTEGRATIONS_DB_NAME: ${INTEGRATIONS_DB_NAME:-trustgrid_integrations}
      INTEGRATIONS_DB_USER: ${INTEGRATIONS_DB_USER:-integration_user}
      INTEGRATIONS_DB_PASSWORD: ${INTEGRATIONS_DB_PASSWORD:-integration_secure_pass_dev}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev_insecure_jwt_secret_key_minimum_32_bytes_long_123}
      ALLOW_INTERNAL_WEBHOOKS: ${ALLOW_INTERNAL_WEBHOOKS:-true}
    ports:
      - "8006:8006"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - trustgrid_network

networks:
  trustgrid_network:
    name: trustgrid_network
    driver: bridge

volumes:
  postgres_data:
  rabbitmq_data:
  redis_data:
  document_data: