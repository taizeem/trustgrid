[project]
name = "identity-service"
version = "0.1.0"
description = "TrustGrid Identity and Tenant Microservice"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.1.0,<5.2",
    "djangorestframework>=3.15.2",
    "psycopg[binary]>=3.2.1",
    "django-environ>=0.11.2",
    "pyjwt[crypto]>=2.9.0",
    "environ>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-django>=4.8.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py", "*_test.py"]
