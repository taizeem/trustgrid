global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: "traefik"
    static_configs:
      - targets: ["gateway:8080"]

  - job_name: "identity-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["identity-service:8001"]

  - job_name: "vendor-assessment-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["vendor-assessment-service:8002"]

  - job_name: "billing-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["billing-service:8007"]

  - job_name: "audit-reporting-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["audit-reporting-service:8008"]

  - job_name: "workflow-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["workflow-service:8003"]

  - job_name: "integrations-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["integrations-service:8006"]

  - job_name: "document-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["document-service:8004"]

  - job_name: "risk-service"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["risk-service:8005"]

  - job_name: "rabbitmq"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["rabbitmq:15692"]