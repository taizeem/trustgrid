http:
  routers:
    identity-router:
      entryPoints:
        - web
      rule: "PathPrefix(`/api/v1/auth`) || PathPrefix(`/api/v1/organizations`)"
      service: identity-service
      middlewares:
        - correlation-id
        - rate-limit
        - cors-headers

    vendor-router:
      entryPoints:
        - web
      rule: "PathPrefix(`/api/v1/vendors`) || PathPrefix(`/api/v1/templates`) || PathPrefix(`/api/v1/assessments`)"
      service: vendor-service
      middlewares:
        - correlation-id
        - cors-headers

    workflow-router:
      entryPoints:
        - web
      rule: "PathPrefix(`/api/v1/workflows`) || Path(`/health`)"
      service: workflow-service
      middlewares:
        - correlation-id
        - cors-headers

    document-router:
      entryPoints:
        - web
      rule: "PathPrefix(`/api/v1/documents`)"
      service: document-service
      middlewares:
        - correlation-id
        - cors-headers

    risk-router:
      entryPoints:
        - web
      rule: "PathPrefix(`/api/v1/risk`)"
      service: risk-service
      middlewares:
        - correlation-id
        - cors-headers

    integration-router:
      entryPoints:
        - web
      rule: "PathPrefix(`/api/v1/integrations`)"
      service: integrations-service
      middlewares:
        - correlation-id
        - cors-headers
    billing-router:
      entryPoints:
        - web
      rule: "PathPrefix(`/api/v1/billing`)"
      service: billing-service
      middlewares:
        - correlation-id
        - cors-headers

  middlewares:
    correlation-id:
      headers:
        customRequestHeaders:
          X-Forwarded-Proto: "http"

    rate-limit:
      rateLimit:
        average: 50
        burst: 100

    cors-headers:
      headers:
        accessControlAllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        accessControlAllowHeaders:
          - Authorization
          - Content-Type
          - X-Correlation-ID
          - X-Tenant-ID
        accessControlMaxAge: 3600
        addVaryHeader: true

  services:
    identity-service:
      loadBalancer:
        servers:
          - url: "http://identity-service:8001"

    vendor-service:
      loadBalancer:
        servers:
          - url: "http://vendor-assessment-service:8002"

    workflow-service:
      loadBalancer:
        servers:
          - url: "http://workflow-service:8003"

    document-service:
      loadBalancer:
        servers:
          - url: "http://document-service:8004"

    risk-service:
      loadBalancer:
        servers:
          - url: "http://risk-service:8005"

    integrations-service:
      loadBalancer:
        servers:
          - url: "http://integrations-service:8006"
    
    billing-service:
      loadBalancer:
        servers:
          - url: "http://billing-service:8007"