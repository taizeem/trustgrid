http:
  routers:
    identity-router:
      entryPoints:
        - web
      rule: "PathPrefix(`/api/v1/auth`) || PathPrefix(`/api/v1/organizations`)"
      service: identity-service
      middlewares:
        - security-headers
        - correlation-id
        - rate-limit
        - cors-headers

    vendor-router:
      entryPoints:
        - web
      rule: "PathPrefix(`/api/v1/vendors`) || PathPrefix(`/api/v1/templates`) || PathPrefix(`/api/v1/assessments`)"
      service: vendor-service
      middlewares:
        - security-headers
        - correlation-id
        - cors-headers

    workflow-router:
      entryPoints:
        - web
      rule: "PathPrefix(`/api/v1/workflows`) || Path(`/health`)"
      service: workflow-service
      middlewares:
        - security-headers
        - correlation-id
        - cors-headers

    document-router:
      entryPoints:
        - web
      rule: "PathPrefix(`/api/v1/documents`)"
      service: document-service
      middlewares:
        - security-headers
        - correlation-id
        - cors-headers

    risk-router:
      entryPoints:
        - web
      rule: "PathPrefix(`/api/v1/risk`)"
      service: risk-service
      middlewares:
        - security-headers
        - correlation-id
        - cors-headers

    integration-router:
      entryPoints:
        - web
      rule: "PathPrefix(`/api/v1/integrations`)"
      service: integrations-service
      middlewares:
        - security-headers
        - correlation-id
        - cors-headers

    billing-router:
      entryPoints:
        - web
      rule: "PathPrefix(`/api/v1/billing`)"
      service: billing-service
      middlewares:
        - security-headers
        - correlation-id
        - cors-headers
    
    audit-router:
      entryPoints:
        - web
      rule: "PathPrefix(`/api/v1/audit`) || PathPrefix(`/api/v1/reports`)"
      service: audit-service
      middlewares:
        - security-headers
        - correlation-id
        - cors-headers

  middlewares:
    security-headers:
      headers:
        frameDeny: true
        contentTypeNosniff: true
        browserXssFilter: true
        stsIncludeSubdomains: true
        stsPreload: true
        stsSeconds: 31536000
        customFrameOptionsValue: "DENY"
        referrerPolicy: "strict-origin-when-cross-origin"
        contentSecurityPolicy: "default-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self';"
        permissionsPolicy: "camera=(), microphone=(), geolocation=(), payment=()"

    correlation-id:
      headers:
        customRequestHeaders:
          X-Forwarded-Proto: "http"

    rate-limit:
      rateLimit:
        average: 50
        burst: 100

    cors-headers:
      headers:
        accessControlAllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        accessControlAllowHeaders:
          - Authorization
          - Content-Type
          - X-Correlation-ID
          - X-Tenant-ID
        accessControlMaxAge: 3600
        addVaryHeader: true